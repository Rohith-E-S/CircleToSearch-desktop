[package]
name = "circle-to-search"
version = "0.1.0"
edition = "2021"
description = "Circle to Search for desktop"
license = "MIT"

[[bin]]
name = "circle-to-search"
path = "main.rs"

[dependencies]
eframe = "0.29"
image = "0.25"
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
webbrowser = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
