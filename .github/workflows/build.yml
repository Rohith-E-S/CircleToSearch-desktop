name: Build Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: circle-to-search-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: circle-to-search-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: circle-to-search-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: circle-to-search-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxrandr-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_src

      - name: Build
        working-directory: rust_src
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cd rust_src/target/${{ matrix.target }}/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv circle-to-search.exe "${{ matrix.artifact }}"
          else
            mv circle-to-search "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust_src/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-artifacts: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/circle-to-search-*
