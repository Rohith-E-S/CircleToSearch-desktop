name: Build Binaries

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # System packages needed to build the Rust binary. xcap additionally needs
  # clang/pipewire/wayland headers for its Linux capture backend.
  LINUX_DEPS: >-
    pkg-config
    libx11-dev
    libxcb1-dev
    libxrandr-dev
    libgtk-3-dev
    libclang-dev
    libdbus-1-dev
    libegl-dev
    libpipewire-0.3-dev
    libwayland-dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_src
      - name: Check formatting
        working-directory: rust_src
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: rust_src
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        working-directory: rust_src
        run: cargo test --locked
      - name: Test legacy Python
        run: python3 -B -m unittest discover -s python_src -p 'test_*.py' -v

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: circle-to-search-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: circle-to-search-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: circle-to-search-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: circle-to-search-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_src

      - name: Stamp build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "CIRCLE_TO_SEARCH_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "CIRCLE_TO_SEARCH_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' rust_src/Cargo.toml | head -n 1)"
            echo "CIRCLE_TO_SEARCH_VERSION=${VERSION:-0.1.0}" >> "$GITHUB_ENV"
          fi
          echo "Building version ${CIRCLE_TO_SEARCH_VERSION} (${CIRCLE_TO_SEARCH_COMMIT})"

      - name: Build
        working-directory: rust_src
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cd rust_src/target/${{ matrix.target }}/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv circle-to-search.exe "${{ matrix.artifact }}"
          else
            mv circle-to-search "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust_src/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Create release
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag and release name
        id: release_info
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="$TAG_NAME"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' rust_src/Cargo.toml | head -n 1)"
            VERSION="${VERSION:-0.1.0}"
            CLEAN_VERSION="${VERSION#v}"
            TAG_NAME="v${CLEAN_VERSION}-build.${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="Circle to Search v${CLEAN_VERSION} (Build ${GITHUB_RUN_NUMBER})"
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect artifacts and generate checksums
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -mindepth 2 -type f -exec mv -t dist/ {} +
          rm -rf circle-to-search-*
          mv dist/* .
          rmdir dist
          ls -la
          sha256sum circle-to-search-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          {
            echo "### Build information"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${{ steps.release_info.outputs.version }}\` |"
            echo "| Commit | \`${{ steps.release_info.outputs.sha }}\` |"
            echo "| Tag | \`${{ steps.release_info.outputs.tag }}\` |"
            echo "| Workflow run | ${{ github.run_number }} |"
            echo
            echo "Binaries are portable and need no installation. Verify a download against \`SHA256SUMS.txt\`."
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: release-notes.md
          make_latest: true
          files: |
            artifacts/circle-to-search-*
            artifacts/SHA256SUMS.txt
